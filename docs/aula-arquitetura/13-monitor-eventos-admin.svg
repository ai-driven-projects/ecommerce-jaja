<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img" aria-label="O monitor de eventos do admin é montado juntando outbox_events, processed_messages e o registro de consumidores" font-family="Manrope, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="m13" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8A8177"/></marker>
    <marker id="m13o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FF6B00"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="620" fill="#FAF8F5"/>
  <text x="40" y="48" font-size="26" font-weight="800" fill="#1E1812">O monitor de eventos do admin</text>
  <text x="40" y="74" font-size="13.5" fill="#8A8177">observabilidade sem plugin: três leituras do banco viram a linha do tempo de um pedido</text>

  <rect x="40" y="110" width="270" height="94" rx="16" fill="#FFFFFF" stroke="#E0D5C9"/>
  <text x="62" y="138" font-size="12" font-weight="800" fill="#1E1812" font-family="'JetBrains Mono', Menlo, monospace">outbox_events</text>
  <text x="62" y="160" font-size="10.5" fill="#8A8177">o evento saiu daqui?</text>
  <text x="62" y="178" font-size="10.5" fill="#8A8177"><tspan font-family="'JetBrains Mono', Menlo, monospace">status · attempts</tspan></text>
  <text x="62" y="194" font-size="10.5" fill="#8A8177"><tspan font-family="'JetBrains Mono', Menlo, monospace">published_at · last_error</tspan></text>

  <rect x="345" y="110" width="270" height="94" rx="16" fill="#FFFFFF" stroke="#E0D5C9"/>
  <text x="367" y="138" font-size="12" font-weight="800" fill="#1E1812" font-family="'JetBrains Mono', Menlo, monospace">processed_messages</text>
  <text x="367" y="160" font-size="10.5" fill="#8A8177">quem já processou?</text>
  <text x="367" y="178" font-size="10.5" fill="#8A8177"><tspan font-family="'JetBrains Mono', Menlo, monospace">consumer · message_id</tspan></text>
  <text x="367" y="194" font-size="10.5" fill="#8A8177"><tspan font-family="'JetBrains Mono', Menlo, monospace">processed_at</tspan></text>

  <rect x="650" y="110" width="270" height="94" rx="16" fill="#FFFFFF" stroke="#E0D5C9"/>
  <text x="672" y="138" font-size="12" font-weight="800" fill="#1E1812" font-family="'JetBrains Mono', Menlo, monospace">EventConsumerRegistry</text>
  <text x="672" y="160" font-size="10.5" fill="#8A8177">quem deveria processar?</text>
  <text x="672" y="178" font-size="10.5" fill="#8A8177">os consumidores registrados</text>
  <text x="672" y="194" font-size="10.5" fill="#8A8177">nesta instância, e a espera de cada um</text>

  <path d="M175 208 C 175 236, 380 226, 440 248" fill="none" stroke="#8A8177" stroke-width="1.5" marker-end="url(#m13)"/>
  <line x1="480" y1="208" x2="480" y2="248" stroke="#8A8177" stroke-width="1.5" marker-end="url(#m13)"/>
  <path d="M785 208 C 785 236, 580 226, 520 248" fill="none" stroke="#8A8177" stroke-width="1.5" marker-end="url(#m13)"/>

  <rect x="280" y="252" width="400" height="60" rx="14" fill="#1E1812"/>
  <text x="480" y="278" font-size="13" font-weight="700" fill="#FF8A3D" text-anchor="middle" font-family="'JetBrains Mono', Menlo, monospace">EventTimelinePrisma</text>
  <text x="480" y="298" font-size="10.5" fill="#B8AFA4" text-anchor="middle">cruza os três por evento e deduz o estado de cada consumidor</text>
  <line x1="480" y1="314" x2="480" y2="352" stroke="#FF6B00" stroke-width="2" marker-end="url(#m13o)"/>

  <rect x="40" y="356" width="880" height="196" rx="18" fill="#FFFFFF" stroke="#E0D5C9"/>
  <text x="62" y="384" font-size="10" font-weight="800" fill="#8A8177" letter-spacing="0.6">O QUE A TELA MOSTRA — GET /orders/:id/events</text>

  <rect x="62" y="394" width="836" height="76" rx="12" fill="#F6F1EA"/>
  <text x="78" y="420" font-size="13" font-weight="700" fill="#1E1812" font-family="'JetBrains Mono', Menlo, monospace">order.picking-started</text>
  <rect x="290" y="404" width="96" height="22" rx="11" fill="#E7F6EE"/>
  <text x="338" y="419" font-size="10" font-weight="800" fill="#0E9F5D" text-anchor="middle">PUBLISHED</text>
  <text x="404" y="420" font-size="10.5" fill="#8A8177">publicado há 1 s · <tspan font-family="'JetBrains Mono', Menlo, monospace">attempts 0</tspan> · <tspan font-family="'JetBrains Mono', Menlo, monospace">causationId</tspan> aponta para o evento anterior</text>
  <rect x="78" y="434" width="290" height="26" rx="13" fill="#FFF7DD"/>
  <text x="94" y="451" font-size="10.5" font-weight="700" fill="#B78A00" font-family="'JetBrains Mono', Menlo, monospace">delivery.dispatch-order · aguardando</text>
  <text x="386" y="451" font-size="10.5" fill="#8A8177">esperado em +6 s — a marca de processada ainda não existe</text>

  <rect x="62" y="484" width="270" height="30" rx="15" fill="#F6F1EA"/>
  <text x="80" y="503" font-size="10.5" font-weight="700" fill="#5C544B">evento pendente</text>
  <text x="196" y="503" font-size="10" fill="#8A8177">ainda não saiu do outbox</text>
  <rect x="345" y="484" width="270" height="30" rx="15" fill="#FFF7DD"/>
  <text x="363" y="503" font-size="10.5" font-weight="700" fill="#B78A00">aguardando</text>
  <text x="452" y="503" font-size="10" fill="#8A8177">publicado, ainda sem marca</text>
  <rect x="628" y="484" width="270" height="30" rx="15" fill="#E7F6EE"/>
  <text x="646" y="503" font-size="10.5" font-weight="700" fill="#0E9F5D">processado</text>
  <text x="730" y="503" font-size="10" fill="#8A8177">a marca existe, com a hora</text>

  <text x="62" y="536" font-size="11.5" fill="#1E1812">Nada disso pergunta ao RabbitMQ: os três estados são deduzidos do banco. Retentativa e descarte ficam invisíveis aqui — vivem no broker.</text>

  <text x="40" y="592" font-size="12" fill="#8A8177" font-family="'JetBrains Mono', Menlo, monospace">apps/backend/src/messaging/monitoring/ · event-timeline.prisma.ts · event-timeline.builder.ts</text>
</svg>
