<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img" aria-label="Os seis blocos do domínio: value object, entidade, agregado, caso de uso, repositório e query, todos devolvendo Result" font-family="Manrope, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="640" fill="#FAF8F5"/>
  <text x="40" y="48" font-size="26" font-weight="800" fill="#1E1812">Os blocos do domínio</text>
  <text x="40" y="74" font-size="13.5" fill="#8A8177">seis peças, seis responsabilidades — cada exemplo é código que existe no projeto</text>

  <!-- 1 VO -->
  <rect x="40" y="110" width="250" height="190" rx="18" fill="#FFFFFF" stroke="#E0D5C9"/>
  <rect x="60" y="130" width="28" height="5" rx="2.5" fill="#5C544B"/>
  <text x="60" y="154" font-size="10" font-weight="800" fill="#8A8177" letter-spacing="0.6">OBJETO DE VALOR</text>
  <text x="60" y="178" font-size="16" font-weight="800" fill="#1E1812">Vale pelo conteúdo</text>
  <text x="60" y="198" font-size="11.5" fill="#8A8177" font-family="'JetBrains Mono', Menlo, monospace">OrderItem · ZipCode · Id</text>
  <line x1="60" y1="212" x2="270" y2="212" stroke="#EFE9E2"/>
  <text x="60" y="234" font-size="11.3" fill="#5C544B">Não tem identidade: dois CEPs</text>
  <text x="60" y="251" font-size="11.3" fill="#5C544B">iguais são o mesmo CEP.</text>
  <text x="60" y="272" font-size="11.3" fill="#5C544B">Nasce validado e normalizado —</text>
  <text x="60" y="289" font-size="11.3" fill="#5C544B">ou não nasce.</text>

  <!-- 2 Entidade -->
  <rect x="355" y="110" width="250" height="190" rx="18" fill="#FFFFFF" stroke="#E0D5C9"/>
  <rect x="375" y="130" width="28" height="5" rx="2.5" fill="#5C544B"/>
  <text x="375" y="154" font-size="10" font-weight="800" fill="#8A8177" letter-spacing="0.6">ENTIDADE</text>
  <text x="375" y="178" font-size="16" font-weight="800" fill="#1E1812">Vale pelo id</text>
  <text x="375" y="198" font-size="11.5" fill="#8A8177" font-family="'JetBrains Mono', Menlo, monospace">Order · Customer · Product</text>
  <line x1="375" y1="212" x2="585" y2="212" stroke="#EFE9E2"/>
  <text x="375" y="234" font-size="11.3" fill="#5C544B">Muda com o tempo e continua</text>
  <text x="375" y="251" font-size="11.3" fill="#5C544B">sendo a mesma coisa.</text>
  <text x="375" y="272" font-size="11.3" fill="#5C544B">Guarda as invariantes: nenhum</text>
  <text x="375" y="289" font-size="11.3" fill="#5C544B">método deixa estado inválido.</text>

  <!-- 3 Agregado -->
  <rect x="670" y="110" width="250" height="190" rx="18" fill="#FFF1E6" stroke="#FFD9BD"/>
  <rect x="690" y="130" width="28" height="5" rx="2.5" fill="#FF6B00"/>
  <text x="690" y="154" font-size="10" font-weight="800" fill="#FF6B00" letter-spacing="0.6">AGREGADO</text>
  <text x="690" y="178" font-size="16" font-weight="800" fill="#1E1812">Fala pelo grupo</text>
  <text x="690" y="198" font-size="11.5" fill="#8A8177" font-family="'JetBrains Mono', Menlo, monospace">Order extends AggregateRoot</text>
  <line x1="690" y1="212" x2="900" y2="212" stroke="#FFD9BD"/>
  <text x="690" y="234" font-size="11.3" fill="#5C544B">Pedido + itens + endereço são</text>
  <text x="690" y="251" font-size="11.3" fill="#5C544B">uma unidade: gravam juntos.</text>
  <text x="690" y="272" font-size="11.3" fill="#1E1812" font-weight="700">É o único lugar que registra</text>
  <text x="690" y="289" font-size="11.3" fill="#1E1812" font-weight="700">eventos (pendingEvents).</text>

  <!-- 4 Caso de uso -->
  <rect x="40" y="320" width="250" height="190" rx="18" fill="#FFFFFF" stroke="#E0D5C9"/>
  <rect x="60" y="340" width="28" height="5" rx="2.5" fill="#5C544B"/>
  <text x="60" y="364" font-size="10" font-weight="800" fill="#8A8177" letter-spacing="0.6">CASO DE USO</text>
  <text x="60" y="388" font-size="16" font-weight="800" fill="#1E1812">Uma ação inteira</text>
  <text x="60" y="408" font-size="11.5" fill="#8A8177" font-family="'JetBrains Mono', Menlo, monospace">PlaceOrder · AdvanceOrderStatus</text>
  <line x1="60" y1="422" x2="270" y2="422" stroke="#EFE9E2"/>
  <text x="60" y="444" font-size="11.3" fill="#5C544B">Busca, valida, chama o agregado</text>
  <text x="60" y="461" font-size="11.3" fill="#5C544B">e grava — nessa ordem.</text>
  <text x="60" y="482" font-size="11.3" fill="#5C544B">É quem abre a transação e quem</text>
  <text x="60" y="499" font-size="11.3" fill="#5C544B">salva os eventos pendentes.</text>

  <!-- 5 Repositorio -->
  <rect x="355" y="320" width="250" height="190" rx="18" fill="#FFFFFF" stroke="#E0D5C9"/>
  <rect x="375" y="340" width="28" height="5" rx="2.5" fill="#5C544B"/>
  <text x="375" y="364" font-size="10" font-weight="800" fill="#8A8177" letter-spacing="0.6">REPOSITÓRIO — ESCRITA</text>
  <text x="375" y="388" font-size="16" font-weight="800" fill="#1E1812">Guarda o agregado</text>
  <text x="375" y="408" font-size="11.5" fill="#8A8177" font-family="'JetBrains Mono', Menlo, monospace">OrderRepository</text>
  <line x1="375" y1="422" x2="585" y2="422" stroke="#EFE9E2"/>
  <text x="375" y="444" font-size="11.3" fill="#5C544B">Fala em agregado inteiro:</text>
  <text x="375" y="461" font-size="11.3" fill="#5C544B">create, update, findById.</text>
  <text x="375" y="482" font-size="11.3" fill="#5C544B">Recebe a transação, para gravar</text>
  <text x="375" y="499" font-size="11.3" fill="#5C544B">junto com o evento.</text>

  <!-- 6 Query -->
  <rect x="670" y="320" width="250" height="190" rx="18" fill="#FFFFFF" stroke="#E0D5C9"/>
  <rect x="690" y="340" width="28" height="5" rx="2.5" fill="#5C544B"/>
  <text x="690" y="364" font-size="10" font-weight="800" fill="#8A8177" letter-spacing="0.6">QUERY — LEITURA (CQRS)</text>
  <text x="690" y="388" font-size="16" font-weight="800" fill="#1E1812">Serve a tela</text>
  <text x="690" y="408" font-size="11.5" fill="#8A8177" font-family="'JetBrains Mono', Menlo, monospace">FindOrdersQuery · ...Summary</text>
  <line x1="690" y1="422" x2="900" y2="422" stroke="#EFE9E2"/>
  <text x="690" y="444" font-size="11.3" fill="#5C544B">SQL direto para um DTO, sem</text>
  <text x="690" y="461" font-size="11.3" fill="#5C544B">montar o agregado.</text>
  <text x="690" y="482" font-size="11.3" fill="#5C544B">Listagem, filtro e paginação não</text>
  <text x="690" y="499" font-size="11.3" fill="#5C544B">precisam de regra de negócio.</text>

  <rect x="40" y="536" width="880" height="56" rx="18" fill="#1E1812"/>
  <text x="64" y="562" font-size="13.5" font-weight="800" fill="#FF8A3D" font-family="'JetBrains Mono', Menlo, monospace">Result&lt;T&gt;</text>
  <text x="64" y="581" font-size="11" fill="#B8AFA4">packages/shared/src/base</text>
  <text x="240" y="562" font-size="12.5" fill="#FAF8F5">Todos os seis devolvem a mesma coisa: <tspan font-weight="700">sucesso com valor</tspan> ou <tspan font-weight="700">falha com códigos</tspan>.</text>
  <text x="240" y="581" font-size="11.5" fill="#B8AFA4">Erro é valor de retorno, não exceção — o controller só traduz o código para HTTP no fim.</text>

  <text x="40" y="622" font-size="12" fill="#5C544B">Regra prática: se a decisão precisa de dados de fora, é <tspan font-weight="700" fill="#1E1812">caso de uso</tspan>; se cabe dentro do agregado, é <tspan font-weight="700" fill="#1E1812">método da entidade</tspan>.</text>
</svg>
