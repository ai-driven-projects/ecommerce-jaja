<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700" role="img" aria-label="Camadas do POST /me/orders: controller chama o caso de uso, que depende de interfaces implementadas pelos adaptadores Prisma e RabbitMQ" font-family="Manrope, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="m02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FF6B00"/></marker>
    <marker id="m02b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5C544B"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="700" fill="#FAF8F5"/>
  <text x="40" y="48" font-size="26" font-weight="800" fill="#1E1812">As camadas de um <tspan font-family="'JetBrains Mono', Menlo, monospace" font-size="22">POST /me/orders</tspan></text>
  <text x="40" y="74" font-size="13.5" fill="#8A8177">o caminho real de um pedido — e por que a dependência se inverte no meio</text>

  <!-- R1 navegador -->
  <text x="196" y="126" font-size="12.5" font-weight="800" fill="#1E1812" text-anchor="end">Navegador</text>
  <text x="196" y="144" font-size="10.5" fill="#8A8177" text-anchor="end">apps/frontend</text>
  <rect x="216" y="100" width="704" height="58" rx="14" fill="#FFFFFF" stroke="#E0D5C9"/>
  <text x="236" y="125" font-size="13" font-weight="700" fill="#1E1812">Tela de checkout</text>
  <text x="236" y="144" font-size="11.5" fill="#8A8177">envia <tspan font-family="'JetBrains Mono', Menlo, monospace">{ recipientName, deliveryInstructions }</tspan> — itens e preços nunca vêm do cliente</text>

  <line x1="568" y1="158" x2="568" y2="182" stroke="#FF6B00" stroke-width="2" marker-end="url(#m02)"/>
  <text x="580" y="175" font-size="10.5" fill="#8A8177">HTTP + JWT</text>

  <!-- R2 controller -->
  <text x="196" y="212" font-size="12.5" font-weight="800" fill="#1E1812" text-anchor="end">Camada HTTP</text>
  <text x="196" y="230" font-size="10.5" fill="#8A8177" text-anchor="end">apps/backend</text>
  <rect x="216" y="184" width="704" height="68" rx="14" fill="#FFFFFF" stroke="#E0D5C9"/>
  <text x="236" y="211" font-size="13" font-weight="700" fill="#1E1812" font-family="'JetBrains Mono', Menlo, monospace">MyOrderController</text>
  <text x="236" y="233" font-size="11.5" fill="#8A8177">lê o <tspan font-weight="700" fill="#5C544B">userId</tspan> do token, monta o caso de uso com os adaptadores e traduz falha em erro HTTP</text>

  <line x1="568" y1="252" x2="568" y2="276" stroke="#FF6B00" stroke-width="2" marker-end="url(#m02)"/>
  <text x="580" y="269" font-size="10.5" fill="#8A8177">chama</text>

  <!-- R3 negocio -->
  <text x="196" y="306" font-size="12.5" font-weight="800" fill="#1E1812" text-anchor="end">Negócio</text>
  <text x="196" y="324" font-size="10.5" fill="#8A8177" text-anchor="end">modules/orders</text>
  <rect x="216" y="278" width="704" height="108" rx="14" fill="#FFF1E6" stroke="#FFD9BD"/>
  <text x="236" y="302" font-size="11" font-weight="800" fill="#FF6B00" letter-spacing="0.4">TYPESCRIPT PURO — SEM NEST, SEM PRISMA, SEM AMQP</text>
  <rect x="232" y="312" width="214" height="60" rx="11" fill="#FFFFFF"/>
  <text x="246" y="334" font-size="12" font-weight="700" fill="#1E1812">PlaceOrder</text>
  <text x="246" y="352" font-size="10.5" fill="#8A8177">caso de uso: orquestra</text>
  <text x="246" y="366" font-size="10.5" fill="#8A8177">as regras, na ordem</text>
  <rect x="460" y="312" width="214" height="60" rx="11" fill="#FFFFFF"/>
  <text x="474" y="334" font-size="12" font-weight="700" fill="#1E1812">Order.place()</text>
  <text x="474" y="352" font-size="10.5" fill="#8A8177">agregado: congela itens,</text>
  <text x="474" y="366" font-size="10.5" fill="#8A8177">soma totais, valida</text>
  <rect x="688" y="312" width="214" height="60" rx="11" fill="#FFFFFF"/>
  <text x="702" y="334" font-size="12" font-weight="700" fill="#FF6B00">OrderPlacedEvent</text>
  <text x="702" y="352" font-size="10.5" fill="#8A8177">fica pendente no agregado</text>
  <text x="702" y="366" font-size="10.5" fill="#8A8177">até o caso de uso pegá-lo</text>

  <line x1="568" y1="386" x2="568" y2="410" stroke="#FF6B00" stroke-width="2" marker-end="url(#m02)"/>
  <text x="580" y="403" font-size="10.5" fill="#8A8177">depende de</text>

  <!-- R4 portas -->
  <text x="196" y="440" font-size="12.5" font-weight="800" fill="#1E1812" text-anchor="end">Portas</text>
  <text x="196" y="458" font-size="10.5" fill="#8A8177" text-anchor="end">interfaces</text>
  <rect x="216" y="412" width="704" height="68" rx="14" fill="#FFFFFF" stroke="#E0D5C9" stroke-dasharray="6 4"/>
  <rect x="232" y="430" width="214" height="34" rx="17" fill="#F6F1EA"/>
  <text x="339" y="452" font-size="11.5" font-weight="700" fill="#1E1812" text-anchor="middle" font-family="'JetBrains Mono', Menlo, monospace">OrderRepository</text>
  <rect x="460" y="430" width="214" height="34" rx="17" fill="#F6F1EA"/>
  <text x="567" y="452" font-size="11.5" font-weight="700" fill="#1E1812" text-anchor="middle" font-family="'JetBrains Mono', Menlo, monospace">DomainEventRepository</text>
  <rect x="688" y="430" width="214" height="34" rx="17" fill="#F6F1EA"/>
  <text x="795" y="452" font-size="11.5" font-weight="700" fill="#1E1812" text-anchor="middle" font-family="'JetBrains Mono', Menlo, monospace">TransactionManager</text>

  <line x1="339" y1="516" x2="339" y2="484" stroke="#5C544B" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#m02b)"/>
  <line x1="567" y1="516" x2="567" y2="484" stroke="#5C544B" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#m02b)"/>
  <line x1="795" y1="516" x2="795" y2="484" stroke="#5C544B" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#m02b)"/>
  <text x="608" y="504" font-size="10.5" font-weight="700" fill="#5C544B">implementa</text>

  <!-- R5 adaptadores -->
  <text x="196" y="544" font-size="12.5" font-weight="800" fill="#1E1812" text-anchor="end">Adaptadores</text>
  <text x="196" y="562" font-size="10.5" fill="#8A8177" text-anchor="end">apps/backend</text>
  <rect x="216" y="516" width="704" height="68" rx="14" fill="#FFFFFF" stroke="#E0D5C9"/>
  <rect x="232" y="534" width="214" height="34" rx="11" fill="#F6F1EA"/>
  <text x="339" y="556" font-size="11.5" font-weight="700" fill="#1E1812" text-anchor="middle" font-family="'JetBrains Mono', Menlo, monospace">OrderPrisma</text>
  <rect x="460" y="534" width="214" height="34" rx="11" fill="#F6F1EA"/>
  <text x="567" y="556" font-size="11.5" font-weight="700" fill="#1E1812" text-anchor="middle" font-family="'JetBrains Mono', Menlo, monospace">DomainEventPrisma</text>
  <rect x="688" y="534" width="214" height="34" rx="11" fill="#F6F1EA"/>
  <text x="795" y="556" font-size="11.5" font-weight="700" fill="#1E1812" text-anchor="middle" font-family="'JetBrains Mono', Menlo, monospace">PrismaService</text>

  <line x1="568" y1="584" x2="568" y2="608" stroke="#FF6B00" stroke-width="2" marker-end="url(#m02)"/>
  <text x="580" y="601" font-size="10.5" fill="#8A8177">SQL</text>

  <!-- R6 infra -->
  <text x="196" y="644" font-size="12.5" font-weight="800" fill="#1E1812" text-anchor="end">Infra</text>
  <rect x="216" y="610" width="704" height="52" rx="14" fill="#1E1812"/>
  <text x="339" y="642" font-size="12.5" font-weight="700" fill="#FAF8F5" text-anchor="middle">PostgreSQL</text>
  <text x="567" y="642" font-size="12.5" font-weight="700" fill="#FAF8F5" text-anchor="middle">tabela orders + carts</text>
  <text x="795" y="642" font-size="12.5" font-weight="700" fill="#FF8A3D" text-anchor="middle">tabela outbox_events</text>

  <text x="40" y="686" font-size="12" fill="#5C544B">A inversão é o ponto: o caso de uso <tspan font-weight="700" fill="#1E1812">nunca importa Prisma</tspan>. Trocar o banco ou o broker mexe só na faixa dos adaptadores.</text>
</svg>
