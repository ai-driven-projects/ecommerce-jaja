<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img" aria-label="Catálogo dos cinco eventos do pedido, quem reage a cada um e qual o efeito" font-family="Manrope, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="620" fill="#FAF8F5"/>
  <text x="40" y="48" font-size="26" font-weight="800" fill="#1E1812">Os cinco eventos do pedido</text>
  <text x="40" y="74" font-size="13.5" fill="#8A8177">cada evento é o gatilho do próximo passo — a cadeia inteira em uma tabela</text>

  <text x="62" y="128" font-size="10.5" font-weight="800" fill="#8A8177" letter-spacing="0.6">EVENTO PUBLICADO</text>
  <text x="352" y="128" font-size="10.5" font-weight="800" fill="#8A8177" letter-spacing="0.6">QUEM REAGE</text>
  <text x="642" y="128" font-size="10.5" font-weight="800" fill="#8A8177" letter-spacing="0.6">O QUE ACONTECE</text>
  <line x1="40" y1="140" x2="920" y2="140" stroke="#E0D5C9"/>

  <rect x="40" y="150" width="880" height="72" rx="14" fill="#FFFFFF" stroke="#E0D5C9"/>
  <text x="62" y="180" font-size="13.5" font-weight="800" fill="#FF6B00" font-family="'JetBrains Mono', Menlo, monospace">order.placed</text>
  <text x="62" y="200" font-size="10.5" fill="#8A8177">gravado por <tspan font-family="'JetBrains Mono', Menlo, monospace">Order.place()</tspan> no checkout</text>
  <text x="352" y="180" font-size="12" font-weight="700" fill="#1E1812" font-family="'JetBrains Mono', Menlo, monospace">payment.approve-order</text>
  <text x="352" y="200" font-size="10.5" fill="#8A8177">gateway de pagamento · espera 3 s</text>
  <text x="642" y="180" font-size="12" fill="#1E1812">pedido vai para <tspan font-weight="700">PAYMENT_APPROVED</tspan></text>
  <text x="642" y="200" font-size="10.5" fill="#8A8177">e grava <tspan font-family="'JetBrains Mono', Menlo, monospace">order.payment-approved</tspan></text>

  <rect x="40" y="228" width="880" height="72" rx="14" fill="#FFFFFF" stroke="#E0D5C9"/>
  <text x="62" y="258" font-size="13.5" font-weight="800" fill="#FF6B00" font-family="'JetBrains Mono', Menlo, monospace">order.payment-approved</text>
  <text x="62" y="278" font-size="10.5" fill="#8A8177">gravado por <tspan font-family="'JetBrains Mono', Menlo, monospace">Order.advanceTo()</tspan></text>
  <text x="352" y="258" font-size="12" font-weight="700" fill="#1E1812" font-family="'JetBrains Mono', Menlo, monospace">store.start-picking</text>
  <text x="352" y="278" font-size="10.5" fill="#8A8177">loja separa os itens · espera 2 s</text>
  <text x="642" y="258" font-size="12" fill="#1E1812">pedido vai para <tspan font-weight="700">PICKING</tspan></text>
  <text x="642" y="278" font-size="10.5" fill="#8A8177">e grava <tspan font-family="'JetBrains Mono', Menlo, monospace">order.picking-started</tspan></text>

  <rect x="40" y="306" width="880" height="72" rx="14" fill="#FFFFFF" stroke="#E0D5C9"/>
  <text x="62" y="336" font-size="13.5" font-weight="800" fill="#FF6B00" font-family="'JetBrains Mono', Menlo, monospace">order.picking-started</text>
  <text x="62" y="356" font-size="10.5" fill="#8A8177">gravado por <tspan font-family="'JetBrains Mono', Menlo, monospace">Order.advanceTo()</tspan></text>
  <text x="352" y="336" font-size="12" font-weight="700" fill="#1E1812" font-family="'JetBrains Mono', Menlo, monospace">delivery.dispatch-order</text>
  <text x="352" y="356" font-size="10.5" fill="#8A8177">entregador sai com o pedido · espera 6 s</text>
  <text x="642" y="336" font-size="12" fill="#1E1812">pedido vai para <tspan font-weight="700">OUT_FOR_DELIVERY</tspan></text>
  <text x="642" y="356" font-size="10.5" fill="#8A8177">e grava <tspan font-family="'JetBrains Mono', Menlo, monospace">order.out-for-delivery</tspan></text>

  <rect x="40" y="384" width="880" height="72" rx="14" fill="#FFFFFF" stroke="#E0D5C9"/>
  <text x="62" y="414" font-size="13.5" font-weight="800" fill="#FF6B00" font-family="'JetBrains Mono', Menlo, monospace">order.out-for-delivery</text>
  <text x="62" y="434" font-size="10.5" fill="#8A8177">gravado por <tspan font-family="'JetBrains Mono', Menlo, monospace">Order.advanceTo()</tspan></text>
  <text x="352" y="414" font-size="12" font-weight="700" fill="#1E1812" font-family="'JetBrains Mono', Menlo, monospace">delivery.complete-order</text>
  <text x="352" y="434" font-size="10.5" fill="#8A8177">entrega ao cliente · espera 8 s</text>
  <text x="642" y="414" font-size="12" fill="#1E1812">pedido vai para <tspan font-weight="700">DELIVERED</tspan></text>
  <text x="642" y="434" font-size="10.5" fill="#8A8177">e grava <tspan font-family="'JetBrains Mono', Menlo, monospace">order.delivered</tspan></text>

  <rect x="40" y="462" width="880" height="72" rx="14" fill="#E7F6EE" stroke="#BEE5D1"/>
  <text x="62" y="492" font-size="13.5" font-weight="800" fill="#0E9F5D" font-family="'JetBrains Mono', Menlo, monospace">order.delivered</text>
  <text x="62" y="512" font-size="10.5" fill="#5C544B">gravado por <tspan font-family="'JetBrains Mono', Menlo, monospace">Order.advanceTo()</tspan></text>
  <text x="352" y="492" font-size="12" font-weight="700" fill="#5C544B">nenhum consumidor de negócio</text>
  <text x="352" y="512" font-size="10.5" fill="#5C544B">só o feed ao vivo assina tudo (<tspan font-family="'JetBrains Mono', Menlo, monospace">#</tspan>)</text>
  <text x="642" y="492" font-size="12" font-weight="700" fill="#0E9F5D">fim da cadeia</text>
  <text x="642" y="512" font-size="10.5" fill="#5C544B">a tela recebe o aviso e recarrega o pedido</text>

  <text x="40" y="572" font-size="12" fill="#5C544B">Os quatro consumidores são <tspan font-weight="700" fill="#1E1812">serviços simulados</tspan> (pagamento, loja, entrega) dentro do próprio backend.</text>
  <text x="40" y="592" font-size="12" fill="#8A8177" font-family="'JetBrains Mono', Menlo, monospace">apps/backend/src/modules/orders/simulation/order-simulation.steps.ts</text>
</svg>
