<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img" aria-label="Os quatro lugares onde vive o código de eventos: contratos, eventos de negócio, infraestrutura e handlers" font-family="Manrope, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="640" fill="#FAF8F5"/>
  <text x="40" y="48" font-size="26" font-weight="800" fill="#1E1812">Onde mora o código de eventos</text>
  <text x="40" y="74" font-size="13.5" fill="#8A8177">quatro lugares, quatro papéis — abra nesta ordem para entender a cadeia</text>

  <!-- P1 contratos -->
  <rect x="40" y="100" width="430" height="230" rx="18" fill="#FFFFFF" stroke="#E0D5C9"/>
  <text x="62" y="130" font-size="10" font-weight="800" fill="#8A8177" letter-spacing="0.6">1 · OS CONTRATOS — NINGUÉM DEPENDE DE NINGUÉM</text>
  <text x="62" y="152" font-size="12" font-weight="800" fill="#1E1812" font-family="'JetBrains Mono', Menlo, monospace">packages/shared/src/</text>
  <line x1="62" y1="166" x2="448" y2="166" stroke="#EFE9E2"/>
  <text x="62" y="190" font-size="11" fill="#1E1812" font-family="'JetBrains Mono', Menlo, monospace">events/domain-event.ts</text>
  <text x="270" y="190" font-size="10.3" fill="#8A8177">a forma de todo evento</text>
  <text x="62" y="214" font-size="11" fill="#1E1812" font-family="'JetBrains Mono', Menlo, monospace">events/abstract-domain-event.ts</text>
  <text x="270" y="214" font-size="10.3" fill="#8A8177">a classe base</text>
  <text x="62" y="238" font-size="11" fill="#1E1812" font-family="'JetBrains Mono', Menlo, monospace">events/domain-event.repository.ts</text>
  <text x="270" y="238" font-size="10.3" fill="#8A8177">a porta do outbox</text>
  <text x="62" y="262" font-size="11" fill="#1E1812" font-family="'JetBrains Mono', Menlo, monospace">messaging/message-publisher.ts</text>
  <text x="270" y="262" font-size="10.3" fill="#8A8177">porta: publicar</text>
  <text x="62" y="286" font-size="11" fill="#1E1812" font-family="'JetBrains Mono', Menlo, monospace">messaging/message-consumer.ts</text>
  <text x="270" y="286" font-size="10.3" fill="#8A8177">porta: consumir</text>
  <text x="62" y="310" font-size="11" fill="#1E1812" font-family="'JetBrains Mono', Menlo, monospace">base/aggregate-root.ts</text>
  <text x="270" y="310" font-size="10.3" fill="#8A8177">addEvent / pullEvents</text>

  <!-- P2 eventos -->
  <rect x="490" y="100" width="430" height="230" rx="18" fill="#FFF1E6" stroke="#FFD9BD"/>
  <text x="512" y="130" font-size="10" font-weight="800" fill="#FF6B00" letter-spacing="0.6">2 · OS EVENTOS DE NEGÓCIO — AQUI ESTÁ O DOMÍNIO</text>
  <text x="512" y="152" font-size="12" font-weight="800" fill="#1E1812" font-family="'JetBrains Mono', Menlo, monospace">modules/orders/src/order/</text>
  <line x1="512" y1="166" x2="898" y2="166" stroke="#FFD9BD"/>
  <text x="512" y="190" font-size="11" fill="#1E1812" font-family="'JetBrains Mono', Menlo, monospace">event/order-placed.event.ts</text>
  <text x="730" y="190" font-size="10.3" fill="#8A8177">order.placed</text>
  <text x="512" y="214" font-size="11" fill="#1E1812" font-family="'JetBrains Mono', Menlo, monospace">event/order-status-changed...</text>
  <text x="730" y="214" font-size="10.3" fill="#8A8177">os 4 tipos de status</text>
  <text x="512" y="238" font-size="11" fill="#1E1812" font-family="'JetBrains Mono', Menlo, monospace">event/index.ts</text>
  <text x="730" y="238" font-size="10.3" fill="#8A8177">o union OrderEvent</text>
  <text x="512" y="262" font-size="11" fill="#1E1812" font-family="'JetBrains Mono', Menlo, monospace">model/order.entity.ts</text>
  <text x="730" y="262" font-size="10.3" fill="#8A8177">quem chama addEvent()</text>
  <text x="512" y="286" font-size="11" fill="#1E1812" font-family="'JetBrains Mono', Menlo, monospace">use-case/place-order...</text>
  <text x="730" y="286" font-size="10.3" fill="#8A8177">quem grava no outbox</text>
  <text x="512" y="310" font-size="11" fill="#1E1812" font-family="'JetBrains Mono', Menlo, monospace">use-case/advance-order-status...</text>
  <text x="730" y="310" font-size="10.3" fill="#8A8177">chamado pelos consumidores</text>

  <!-- P3 infra -->
  <rect x="40" y="350" width="430" height="230" rx="18" fill="#FFFFFF" stroke="#E0D5C9"/>
  <text x="62" y="380" font-size="10" font-weight="800" fill="#8A8177" letter-spacing="0.6">3 · A INFRAESTRUTURA — O ENCANAMENTO</text>
  <text x="62" y="402" font-size="12" font-weight="800" fill="#1E1812" font-family="'JetBrains Mono', Menlo, monospace">apps/backend/src/messaging/</text>
  <line x1="62" y1="416" x2="448" y2="416" stroke="#EFE9E2"/>
  <text x="62" y="440" font-size="11" fill="#1E1812" font-family="'JetBrains Mono', Menlo, monospace">outbox/</text>
  <text x="270" y="440" font-size="10.3" fill="#8A8177">relay, lote, retry</text>
  <text x="62" y="464" font-size="11" fill="#1E1812" font-family="'JetBrains Mono', Menlo, monospace">consumer/</text>
  <text x="270" y="464" font-size="10.3" fill="#8A8177">registry, runner, idempotência</text>
  <text x="62" y="488" font-size="11" fill="#1E1812" font-family="'JetBrains Mono', Menlo, monospace">rabbitmq/</text>
  <text x="270" y="488" font-size="10.3" fill="#8A8177">publisher e consumer AMQP</text>
  <text x="62" y="512" font-size="11" fill="#1E1812" font-family="'JetBrains Mono', Menlo, monospace">live/</text>
  <text x="270" y="512" font-size="10.3" fill="#8A8177">feed ao vivo por instância</text>
  <text x="62" y="536" font-size="11" fill="#1E1812" font-family="'JetBrains Mono', Menlo, monospace">monitoring/</text>
  <text x="270" y="536" font-size="10.3" fill="#8A8177">linha do tempo do admin</text>
  <text x="62" y="560" font-size="11" font-weight="700" fill="#1E1812" font-family="'JetBrains Mono', Menlo, monospace">messaging.module.ts</text>
  <text x="270" y="560" font-size="10.3" fill="#8A8177">liga as portas ao RabbitMQ</text>

  <!-- P4 handlers -->
  <rect x="490" y="350" width="430" height="230" rx="18" fill="#FFFFFF" stroke="#E0D5C9"/>
  <text x="512" y="380" font-size="10" font-weight="800" fill="#8A8177" letter-spacing="0.6">4 · OS HANDLERS E AS TELAS — QUEM REAGE</text>
  <text x="512" y="402" font-size="12" font-weight="800" fill="#1E1812" font-family="'JetBrains Mono', Menlo, monospace">apps/backend/src/modules/orders/</text>
  <line x1="512" y1="416" x2="898" y2="416" stroke="#EFE9E2"/>
  <text x="512" y="440" font-size="11" font-weight="700" fill="#1E1812" font-family="'JetBrains Mono', Menlo, monospace">simulation/...steps.ts</text>
  <text x="730" y="440" font-size="10.3" fill="#8A8177">os 4 passos e as esperas</text>
  <text x="512" y="464" font-size="11" font-weight="700" fill="#1E1812" font-family="'JetBrains Mono', Menlo, monospace">simulation/...consumers.ts</text>
  <text x="730" y="464" font-size="10.3" fill="#8A8177">os handlers, registrados no boot</text>
  <text x="512" y="488" font-size="11" fill="#1E1812" font-family="'JetBrains Mono', Menlo, monospace">order-live-updates.ts</text>
  <text x="730" y="488" font-size="10.3" fill="#8A8177">avisos SSE por pedido</text>
  <text x="512" y="512" font-size="11" fill="#1E1812" font-family="'JetBrains Mono', Menlo, monospace">my-order.controller.ts</text>
  <text x="730" y="512" font-size="10.3" fill="#8A8177">POST /me/orders + stream</text>
  <text x="512" y="536" font-size="11" fill="#1E1812" font-family="'JetBrains Mono', Menlo, monospace">order-admin.controller.ts</text>
  <text x="730" y="536" font-size="10.3" fill="#8A8177">monitor e linha do tempo</text>
  <text x="512" y="560" font-size="11" fill="#1E1812" font-family="'JetBrains Mono', Menlo, monospace">orders.module.ts</text>
  <text x="730" y="560" font-size="10.3" fill="#8A8177">importa o MessagingModule</text>

  <text x="40" y="614" font-size="12" fill="#5C544B">O quadro 2 é o único que fala de pedido. Os outros três serviriam para <tspan font-weight="700" fill="#1E1812">qualquer</tspan> módulo que quisesse publicar eventos.</text>
</svg>
