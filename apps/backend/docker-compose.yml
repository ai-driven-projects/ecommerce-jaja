services:
  postgres:
    image: postgres:16-alpine
    container_name: jaja-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: jaja
      POSTGRES_PASSWORD: jaja
      POSTGRES_DB: jaja
    ports:
      # Porta do host vem do DB_PORT do .env (5433 por padrão: 5432 costuma estar ocupada por outro projeto).
      - '${DB_PORT:-5433}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jaja']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
