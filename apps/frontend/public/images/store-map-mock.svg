<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="store-map-mock-title store-map-mock-desc">
  <title id="store-map-mock-title">Mapa simulado</title>
  <desc id="store-map-mock-desc">Ilustração própria de quadras e ruas ao redor da Av. Paulista, com um marcador no centro e o círculo translúcido do raio de atendimento.</desc>

  <!-- Ruas (fundo branco) -->
  <rect width="640" height="360" fill="#FFFFFF" />

  <!-- Quadras -->
  <g fill="#E9EFE9">
    <rect x="8" y="8" width="92" height="64" rx="10" />
    <rect x="116" y="8" width="92" height="64" rx="10" />
    <rect x="224" y="8" width="92" height="64" rx="10" />
    <rect x="332" y="8" width="92" height="64" rx="10" />
    <rect x="440" y="8" width="92" height="64" rx="10" />
    <rect x="548" y="8" width="84" height="64" rx="10" />

    <rect x="8" y="88" width="92" height="64" rx="10" />
    <rect x="116" y="88" width="92" height="64" rx="10" />
    <rect x="224" y="88" width="92" height="64" rx="10" />
    <rect x="332" y="88" width="92" height="64" rx="10" />
    <rect x="440" y="88" width="92" height="64" rx="10" />
    <rect x="548" y="88" width="84" height="64" rx="10" />

    <rect x="8" y="168" width="92" height="64" rx="10" />
    <rect x="116" y="168" width="92" height="64" rx="10" />
    <rect x="224" y="168" width="92" height="64" rx="10" />
    <rect x="332" y="168" width="92" height="64" rx="10" />
    <rect x="440" y="168" width="92" height="64" rx="10" />
    <rect x="548" y="168" width="84" height="64" rx="10" />

    <rect x="8" y="248" width="92" height="64" rx="10" />
    <rect x="116" y="248" width="92" height="64" rx="10" />
    <rect x="224" y="248" width="92" height="64" rx="10" />
    <rect x="332" y="248" width="92" height="64" rx="10" />
    <rect x="440" y="248" width="92" height="64" rx="10" />
    <rect x="548" y="248" width="84" height="64" rx="10" />

    <rect x="8" y="328" width="92" height="40" rx="10" />
    <rect x="116" y="328" width="92" height="40" rx="10" />
    <rect x="224" y="328" width="92" height="40" rx="10" />
    <rect x="332" y="328" width="92" height="40" rx="10" />
    <rect x="440" y="328" width="92" height="40" rx="10" />
    <rect x="548" y="328" width="84" height="40" rx="10" />
  </g>

  <!-- Praças arborizadas -->
  <g fill="#0E9F5D" fill-opacity="0.16">
    <rect x="440" y="248" width="92" height="64" rx="10" />
    <rect x="116" y="8" width="92" height="64" rx="10" />
  </g>

  <!-- Avenida larga (Av. Paulista), com borda e faixa central tracejada -->
  <line x1="-20" y1="290" x2="660" y2="70" stroke="#EFE9E2" stroke-width="40" />
  <line x1="-20" y1="290" x2="660" y2="70" stroke="#FFFFFF" stroke-width="34" />
  <line x1="-20" y1="290" x2="660" y2="70" stroke="#EFE9E2" stroke-width="2" stroke-dasharray="14 12" />

  <!-- Nome da avenida -->
  <text x="112" y="246" transform="rotate(-17.9 112 246)" font-family="Manrope, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="800" fill="#5C544B" stroke="#FFFFFF" stroke-width="4" paint-order="stroke">Av. Paulista</text>

  <!-- Círculo do raio -->
  <circle cx="320" cy="180" r="120" fill="#FF6B00" fill-opacity="0.14" />
  <circle cx="320" cy="180" r="120" fill="none" stroke="#FF6B00" stroke-width="3" stroke-dasharray="8 8" />

  <!-- Marcador -->
  <ellipse cx="320" cy="182" rx="11" ry="4" fill="#1E1812" fill-opacity="0.18" />
  <path d="M320 180 C316 170 298 156 298 138 A22 22 0 0 1 342 138 C342 156 324 170 320 180 Z" fill="#FF6B00" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round" />
  <circle cx="320" cy="138" r="8" fill="#FFFFFF" />
</svg>
