<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 740" width="960" height="740" role="img" aria-label="Ciclo de vida de uma mensagem no consumidor: espera, transação única com marca de processada, handler e novos eventos, e os desvios de duplicata, falha e descarte" font-family="Manrope, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="m10" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FF6B00"/></marker>
    <marker id="m10g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8A8177"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="740" fill="#FAF8F5"/>
  <text x="40" y="48" font-size="26" font-weight="800" fill="#1E1812">A vida de uma mensagem no consumidor</text>
  <text x="40" y="74" font-size="13.5" fill="#8A8177">o caminho feliz à esquerda, os três desvios à direita — <tspan font-family="'JetBrains Mono', Menlo, monospace">EventConsumerRunner</tspan></text>

  <!-- S1 -->
  <rect x="40" y="110" width="520" height="62" rx="14" fill="#FFFFFF" stroke="#E0D5C9"/>
  <text x="62" y="136" font-size="12.5" font-weight="800" fill="#1E1812">1 · A mensagem chega na fila do consumidor</text>
  <text x="62" y="158" font-size="10.8" fill="#8A8177" font-family="'JetBrains Mono', Menlo, monospace">jaja.payment.approve-order · prefetch 10 · uma instância só recebe</text>
  <line x1="300" y1="172" x2="300" y2="186" stroke="#FF6B00" stroke-width="2" marker-end="url(#m10)"/>

  <!-- S2 -->
  <rect x="40" y="190" width="520" height="76" rx="14" fill="#FFF7DD" stroke="#EFDFA8"/>
  <text x="62" y="216" font-size="12.5" font-weight="800" fill="#1E1812">2 · A espera do serviço acontece no broker</text>
  <text x="62" y="238" font-size="11" fill="#5C544B">Na primeira entrega a mensagem é republicada em <tspan font-family="'JetBrains Mono', Menlo, monospace" font-weight="700">.wait</tspan> com <tspan font-family="'JetBrains Mono', Menlo, monospace" font-weight="700">expiration: 3000</tspan>,</text>
  <text x="62" y="256" font-size="11" fill="#5C544B">volta sozinha quando o TTL expira. Nenhum <tspan font-family="'JetBrains Mono', Menlo, monospace">setTimeout</tspan> segurando transação.</text>
  <line x1="300" y1="266" x2="300" y2="280" stroke="#FF6B00" stroke-width="2" marker-end="url(#m10)"/>

  <!-- S3 -->
  <rect x="40" y="284" width="520" height="200" rx="14" fill="#FFF1E6" stroke="#FFD9BD"/>
  <text x="62" y="308" font-size="10" font-weight="800" fill="#FF6B00" letter-spacing="0.6">3 · UMA TRANSAÇÃO SÓ — TUDO OU NADA</text>
  <rect x="62" y="320" width="476" height="36" rx="9" fill="#FFFFFF"/>
  <text x="78" y="343" font-size="11" font-weight="700" fill="#1E1812" font-family="'JetBrains Mono', Menlo, monospace">markProcessed()</text>
  <text x="250" y="343" font-size="10.5" fill="#5C544B">grava a marca em <tspan font-family="'JetBrains Mono', Menlo, monospace">processed_messages</tspan></text>
  <rect x="62" y="360" width="476" height="36" rx="9" fill="#FFFFFF"/>
  <text x="78" y="383" font-size="11" font-weight="700" fill="#1E1812" font-family="'JetBrains Mono', Menlo, monospace">handler(msg, tx)</text>
  <text x="250" y="383" font-size="10.5" fill="#5C544B">chama <tspan font-family="'JetBrains Mono', Menlo, monospace">AdvanceOrderStatus</tspan> com a mesma tx</text>
  <rect x="62" y="400" width="476" height="36" rx="9" fill="#FFFFFF"/>
  <text x="78" y="423" font-size="11" font-weight="700" fill="#1E1812" font-family="'JetBrains Mono', Menlo, monospace">append(novos eventos)</text>
  <text x="250" y="423" font-size="10.5" fill="#5C544B">o próximo evento nasce <tspan font-family="'JetBrains Mono', Menlo, monospace">PENDING</tspan> no outbox</text>
  <rect x="62" y="440" width="476" height="36" rx="9" fill="#1E1812"/>
  <text x="78" y="463" font-size="11" font-weight="700" fill="#FF8A3D" font-family="'JetBrains Mono', Menlo, monospace">COMMIT</text>
  <text x="250" y="463" font-size="10.5" fill="#FAF8F5">marca, status e próximo evento nascem juntos</text>
  <line x1="300" y1="484" x2="300" y2="498" stroke="#FF6B00" stroke-width="2" marker-end="url(#m10)"/>

  <!-- S4 -->
  <rect x="40" y="502" width="520" height="62" rx="14" fill="#E7F6EE" stroke="#BEE5D1"/>
  <text x="62" y="528" font-size="12.5" font-weight="800" fill="#0E9F5D">4 · ack — a mensagem sai da fila</text>
  <text x="62" y="550" font-size="10.8" fill="#5C544B">O relay já vai encontrar o novo evento pendente e publicar o próximo passo.</text>

  <!-- desvios -->
  <line x1="566" y1="320" x2="594" y2="320" stroke="#8A8177" stroke-width="1.6" marker-end="url(#m10g)"/>
  <rect x="600" y="284" width="320" height="90" rx="14" fill="#FFFFFF" stroke="#E0D5C9"/>
  <text x="620" y="310" font-size="10" font-weight="800" fill="#8A8177" letter-spacing="0.6">SE A MARCA JÁ EXISTIA</text>
  <text x="620" y="332" font-size="11" fill="#1E1812">A chave é <tspan font-family="'JetBrains Mono', Menlo, monospace" font-weight="700">(consumer, messageId)</tspan>:</text>
  <text x="620" y="350" font-size="11" fill="#1E1812">o handler <tspan font-weight="700">nem roda</tspan> e a mensagem</text>
  <text x="620" y="368" font-size="11" fill="#1E1812">recebe ack. É a idempotência.</text>

  <line x1="566" y1="438" x2="594" y2="438" stroke="#8A8177" stroke-width="1.6" marker-end="url(#m10g)"/>
  <rect x="600" y="392" width="320" height="92" rx="14" fill="#FFF7DD" stroke="#EFDFA8"/>
  <text x="620" y="418" font-size="10" font-weight="800" fill="#B78A00" letter-spacing="0.6">SE QUALQUER PASSO FALHAR</text>
  <text x="620" y="440" font-size="11" fill="#1E1812">Rollback de tudo — inclusive da marca.</text>
  <text x="620" y="458" font-size="11" fill="#1E1812">Republica com <tspan font-family="'JetBrains Mono', Menlo, monospace" font-weight="700">x-jaja-attempt + 1</tspan></text>
  <text x="620" y="476" font-size="11" fill="#1E1812">e espera o backoff na <tspan font-family="'JetBrains Mono', Menlo, monospace" font-weight="700">.wait</tspan>.</text>

  <line x1="566" y1="533" x2="594" y2="533" stroke="#8A8177" stroke-width="1.6" marker-end="url(#m10g)"/>
  <rect x="600" y="502" width="320" height="62" rx="14" fill="#FDEBEA" stroke="#F2C3BF"/>
  <text x="620" y="528" font-size="10" font-weight="800" fill="#C93A31" letter-spacing="0.6">NA 5ª TENTATIVA</text>
  <text x="620" y="550" font-size="11" fill="#1E1812">Vai para a <tspan font-family="'JetBrains Mono', Menlo, monospace" font-weight="700">.dead</tspan> com o motivo no cabeçalho.</text>

  <!-- causation -->
  <rect x="40" y="596" width="880" height="86" rx="18" fill="#FFFFFF" stroke="#E0D5C9"/>
  <text x="62" y="624" font-size="10" font-weight="800" fill="#8A8177" letter-spacing="0.6">CAUSAÇÃO — O QUE LIGA UM EVENTO AO OUTRO</text>
  <text x="62" y="648" font-size="12" fill="#1E1812">O evento gravado dentro de um consumidor herda a origem da mensagem: <tspan font-family="'JetBrains Mono', Menlo, monospace" font-weight="700">causationId</tspan> = quem causou este evento;</text>
  <text x="62" y="668" font-size="12" fill="#1E1812"><tspan font-family="'JetBrains Mono', Menlo, monospace" font-weight="700">correlationId</tspan> = o id que atravessa a cadeia inteira, do <tspan font-family="'JetBrains Mono', Menlo, monospace">order.placed</tspan> até o <tspan font-family="'JetBrains Mono', Menlo, monospace">order.delivered</tspan>.</text>

  <text x="40" y="716" font-size="12" fill="#8A8177" font-family="'JetBrains Mono', Menlo, monospace">apps/backend/src/messaging/consumer/ · event-consumer.runner.ts · processed-message.prisma.ts · message-causation.ts</text>
</svg>
