<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 710" width="960" height="710" role="img" aria-label="Caminho do aviso ao vivo: fila transiente, LiveEventFeed, SSE e recarga pela API REST" font-family="Manrope, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="m12" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FF6B00"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="710" fill="#FAF8F5"/>
  <text x="40" y="48" font-size="26" font-weight="800" fill="#1E1812">Como a tela fica viva</text>
  <text x="40" y="74" font-size="13.5" fill="#8A8177">do evento no broker até o pedido se mexendo na tela, sem o usuário apertar F5</text>

  <line x1="130" y1="130" x2="130" y2="258" stroke="#8A8177" stroke-width="3" stroke-linecap="round"/>
  <text x="40" y="152" font-size="10" font-weight="800" fill="#8A8177" letter-spacing="0.6">BROKER</text>
  <line x1="130" y1="274" x2="130" y2="474" stroke="#FF6B00" stroke-width="3" stroke-linecap="round"/>
  <text x="40" y="296" font-size="10" font-weight="800" fill="#FF6B00" letter-spacing="0.6">BACKEND</text>
  <line x1="130" y1="490" x2="130" y2="618" stroke="#0E9F5D" stroke-width="3" stroke-linecap="round"/>
  <text x="40" y="512" font-size="10" font-weight="800" fill="#0E9F5D" letter-spacing="0.6">NAVEGADOR</text>

  <rect x="150" y="130" width="770" height="56" rx="13" fill="#FFFFFF" stroke="#E0D5C9"/>
  <text x="170" y="154" font-size="12.5" font-weight="700" fill="#1E1812">O evento é publicado no exchange, como qualquer outro</text>
  <text x="170" y="173" font-size="10.5" fill="#8A8177">o feed ao vivo não tem canal próprio — ele escuta o mesmo <tspan font-family="'JetBrains Mono', Menlo, monospace">jaja.events</tspan></text>
  <text x="900" y="154" font-size="10.5" fill="#8A8177" text-anchor="end" font-family="'JetBrains Mono', Menlo, monospace">topic</text>
  <line x1="200" y1="188" x2="200" y2="198" stroke="#FF6B00" stroke-width="2" marker-end="url(#m12)"/>

  <rect x="150" y="202" width="770" height="56" rx="13" fill="#F6F1EA" stroke="#E0D5C9" stroke-dasharray="5 4"/>
  <text x="170" y="226" font-size="12.5" font-weight="700" fill="#1E1812">Fila transiente, uma por instância, assinando tudo (<tspan font-family="'JetBrains Mono', Menlo, monospace">#</tspan>)</text>
  <text x="170" y="245" font-size="10.5" fill="#8A8177">exclusiva e apagada junto com a conexão — cada instância recebe <tspan font-weight="700">sua própria cópia</tspan></text>
  <text x="900" y="226" font-size="10.5" fill="#8A8177" text-anchor="end" font-family="'JetBrains Mono', Menlo, monospace">jaja.live.&lt;host&gt;.&lt;pid&gt;</text>
  <line x1="200" y1="260" x2="200" y2="270" stroke="#FF6B00" stroke-width="2" marker-end="url(#m12)"/>

  <rect x="150" y="274" width="770" height="56" rx="13" fill="#FFF1E6" stroke="#FFD9BD"/>
  <text x="170" y="298" font-size="12.5" font-weight="700" fill="#1E1812">Cada mensagem vira um item de um <tspan font-family="'JetBrains Mono', Menlo, monospace">Subject</tspan> do RxJS</text>
  <text x="170" y="317" font-size="10.5" fill="#8A8177">em memória, sem idempotência e sem retentativa: aviso perdido é aviso perdido</text>
  <text x="900" y="298" font-size="10.5" fill="#8A8177" text-anchor="end" font-family="'JetBrains Mono', Menlo, monospace">LiveEventFeed.events$</text>
  <line x1="200" y1="332" x2="200" y2="342" stroke="#FF6B00" stroke-width="2" marker-end="url(#m12)"/>

  <rect x="150" y="346" width="770" height="56" rx="13" fill="#FFF1E6" stroke="#FFD9BD"/>
  <text x="170" y="370" font-size="12.5" font-weight="700" fill="#1E1812">Filtra pelo pedido e monta o aviso — sem payload de negócio</text>
  <text x="170" y="389" font-size="10.5" fill="#8A8177">só <tspan font-family="'JetBrains Mono', Menlo, monospace">{ orderId, eventType, messageId, occurredAt }</tspan> + um <tspan font-family="'JetBrains Mono', Menlo, monospace">ping</tspan> a cada 20 s</text>
  <text x="900" y="370" font-size="10.5" fill="#8A8177" text-anchor="end" font-family="'JetBrains Mono', Menlo, monospace">OrderLiveUpdates</text>
  <line x1="200" y1="404" x2="200" y2="414" stroke="#FF6B00" stroke-width="2" marker-end="url(#m12)"/>

  <rect x="150" y="418" width="770" height="56" rx="13" fill="#FFF1E6" stroke="#FFD9BD"/>
  <text x="170" y="442" font-size="12.5" font-weight="700" fill="#1E1812">Sai pela rota SSE do pedido (e a do admin, com todos)</text>
  <text x="170" y="461" font-size="10.5" fill="#8A8177">conexão HTTP que fica aberta, <tspan font-family="'JetBrains Mono', Menlo, monospace">text/event-stream</tspan></text>
  <text x="900" y="442" font-size="10.5" fill="#8A8177" text-anchor="end" font-family="'JetBrains Mono', Menlo, monospace">@Sse(':id/stream')</text>
  <line x1="200" y1="476" x2="200" y2="486" stroke="#FF6B00" stroke-width="2" marker-end="url(#m12)"/>

  <rect x="150" y="490" width="770" height="56" rx="13" fill="#FFFFFF" stroke="#E0D5C9"/>
  <text x="170" y="514" font-size="12.5" font-weight="700" fill="#1E1812">O navegador abre o stream com <tspan font-family="'JetBrains Mono', Menlo, monospace">fetch</tspan>, não com <tspan font-family="'JetBrains Mono', Menlo, monospace">EventSource</tspan></text>
  <text x="170" y="533" font-size="10.5" fill="#8A8177">a <tspan font-family="'JetBrains Mono', Menlo, monospace">EventSource</tspan> nativa não manda cabeçalho — e o token nunca vai na URL</text>
  <text x="900" y="514" font-size="10.5" fill="#8A8177" text-anchor="end" font-family="'JetBrains Mono', Menlo, monospace">openEventStream()</text>
  <line x1="200" y1="548" x2="200" y2="558" stroke="#0E9F5D" stroke-width="2" marker-end="url(#m12)"/>

  <rect x="150" y="562" width="770" height="56" rx="13" fill="#E7F6EE" stroke="#BEE5D1"/>
  <text x="170" y="586" font-size="12.5" font-weight="700" fill="#0E9F5D">Ao receber o aviso, a tela busca o pedido de novo na API REST</text>
  <text x="170" y="605" font-size="10.5" fill="#5C544B">a REST continua sendo a fonte da verdade; o aviso só diz <tspan font-weight="700">"olhe de novo"</tspan></text>
  <text x="900" y="586" font-size="10.5" fill="#5C544B" text-anchor="end" font-family="'JetBrains Mono', Menlo, monospace">useLiveRefetch()</text>

  <text x="40" y="664" font-size="12.5" fill="#1E1812">Por que o aviso não carrega o estado: se uma mensagem se perder — broker reiniciou, instância sem conexão — <tspan font-weight="700">a tela não fica errada</tspan>.</text>
  <text x="40" y="686" font-size="12" fill="#5C544B">A próxima leitura corrige sozinha. É o que permite usar uma fila sem garantia nenhuma para a parte visual.</text>
</svg>
